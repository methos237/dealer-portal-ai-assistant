name: images

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "api/**"
      - "assistant/**"
      - "mcp-m365/**"
      - "docker/**"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "**/Dockerfile"
      - ".dockerignore"
      - "**/.dockerignore"
      - ".github/workflows/images.yml"

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: web
            file: web/Dockerfile
          - name: api
            context: .
            file: api/Dockerfile
          - name: assistant
            context: assistant
            file: assistant/Dockerfile
          - name: mcp-m365
            context: mcp-m365
            file: mcp-m365/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: BUILD_ID=${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/dealer-portal-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/dealer-portal-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
