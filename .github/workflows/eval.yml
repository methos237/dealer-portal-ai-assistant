name: eval

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ["assistant/**", ".github/workflows/eval.yml"]
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Free: local embedder, no secrets. Runs on every PR that touches the assistant.
  retrieval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dealer_portal
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dealer_portal
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: assistant/uv.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: uv sync --locked
      - run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: uv run python -m rag.migrate
      - run: uv run python -m rag.ingest fixtures/docs
      - name: Retrieval suite
        run: |
          uv run evals --suite retrieval | tee eval.txt
          { echo '## Retrieval eval'; echo; echo '```'; cat eval.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results
          path: assistant/evals/out/*.json

  # Paid: LLM-graded suites, about 1.50 USD per run (the chat model, not the judge, is the cost; judge
  # verdicts are keyed on the live answer text so the cache rarely hits across runs). Runs only on dispatch
  # and on pull requests labeled `eval`; the retrieval job alone gates ordinary pull requests.
  full:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'eval')
    needs: retrieval
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dealer_portal
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dealer_portal
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: assistant/uv.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: uv sync --locked
      - run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: uv run python -m rag.migrate
      - run: uv run python -m rag.ingest fixtures/docs
      - name: All suites (spends API tokens; judge verdicts come from the committed cache when unchanged)
        run: |
          uv run evals | tee eval.txt
          { echo '## Full eval'; echo; echo '```'; cat eval.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results-full
          path: assistant/evals/out/*.json
