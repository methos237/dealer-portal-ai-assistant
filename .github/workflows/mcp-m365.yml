name: mcp-m365

on:
  push:
    branches: [master]
    paths: ["mcp-m365/**", ".github/workflows/mcp-m365.yml"]
  pull_request:

concurrency:
  group: mcp-m365-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: mcp-m365
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-m365
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mcp-m365/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
