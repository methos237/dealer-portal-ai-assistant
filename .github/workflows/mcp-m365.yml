name: mcp-m365

on:
  push:
    branches: [master]
    paths: ["mcp-m365/**", ".github/workflows/mcp-m365.yml"]
  pull_request:
    paths: ["mcp-m365/**", ".github/workflows/mcp-m365.yml"]

concurrency:
  group: mcp-m365-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-m365
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: mcp-m365/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: docker build -t mcp-m365 .
