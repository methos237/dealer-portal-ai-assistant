name: assistant

on:
  push:
    branches: [master]
    paths: ["assistant/**", ".github/workflows/assistant.yml"]
  pull_request:
    paths: ["assistant/**", ".github/workflows/assistant.yml"]

concurrency:
  group: assistant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: assistant/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pytest -q -m "not live"
