name: infra

on:
  push:
    branches: [master]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  pull_request:

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  check:
    name: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: az bicep install
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null

  # Read-only preview of what a merge would change. Secure parameters get placeholders: what-if
  # compares shape, not secret values.
  what-if:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          az group create -n "${{ vars.AZURE_RESOURCE_GROUP }}" -l eastus2 -o none
          az deployment group what-if -g "${{ vars.AZURE_RESOURCE_GROUP }}" --template-file infra/main.bicep \
            --parameters infra/dev.parameters.json \
            --parameters webClientId="${{ vars.WEB_CLIENT_ID }}" entraApiScope="${{ vars.ENTRA_API_SCOPE }}" \
              m365Site="${{ vars.M365_SITE }}" budgetEmail="${{ vars.BUDGET_EMAIL }}" \
              postgresAdminPassword=placeholder-Aa1! webClientSecret=placeholder authSecret=placeholder \
              anthropicApiKey=placeholder m365ClientSecret=placeholder
