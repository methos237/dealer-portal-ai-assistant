[project]
name = "functions"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "assistant",
    "azure-functions>=1.25.0",
    "azure-identity>=1.25.3",
]

[tool.uv.sources]
assistant = { path = "../assistant", editable = true }

[dependency-groups]
dev = ["ruff>=0.16.9"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
