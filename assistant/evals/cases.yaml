    question: How long is the Aria warranty and when does it start?
    expected: [{doc: owner-manual-aria.md, section: Warranty}]
  - id: aria-warranty-exclusions
    suite: retrieval
    question: Are tires and the house battery covered under the Aria warranty?
    expected: [{doc: owner-manual-aria.md, section: What is excluded}]
  - id: aria-slide-seal-care
    suite: retrieval
    question: How often should slide-out seals be cleaned and what should never be used on them?
    expected: [{doc: owner-manual-aria.md, section: Seal care}, {doc: owner-manual-summit.md, section: Slide-outs}]
  - id: aria-converter-voltages
    suite: retrieval
    question: What voltages does the Aria converter output in bulk, absorption and float?
