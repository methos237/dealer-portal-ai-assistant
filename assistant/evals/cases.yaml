# Eval cases against assistant/fixtures/docs. Suites: retrieval (programmatic, every PR),
# answer (LLM judge, Phase 3). expected.section matches the chunk's heading path, case-insensitive.
cases:
  # ---- retrieval: manuals
  - id: aria-hitch-ball
    suite: retrieval
    question: What size hitch ball does the Aria need?
    expected: [{doc: owner-manual-aria.md, section: Hitching and towing}]
  - id: aria-tongue-weight
    suite: retrieval
    question: Target tongue weight range for a loaded Aria 28
    expected: [{doc: owner-manual-aria.md, section: Hitching and towing}]
  - id: aria-tire-pressure
    suite: retrieval
    question: Aria trailer tire size and cold pressure
    expected: [{doc: owner-manual-aria.md}]
  - id: aria-warranty-length
