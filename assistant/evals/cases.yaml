    expected: [{doc: owner-manual-aria.md, section: Awning}]
  - id: aria-water-pump
    suite: retrieval
    question: Aria water pump flow rate and cutoff pressure
    expected: [{doc: owner-manual-aria.md, section: Water system}]
  - id: aria-maintenance-bearings
    suite: retrieval
    question: When do the Aria wheel bearings need repacking?
    expected: [{doc: owner-manual-aria.md, section: Maintenance schedule}]
  - id: summit-def-derate
    suite: retrieval
    question: What happens when the Summit runs out of DEF?
    expected: [{doc: owner-manual-summit.md, section: Chassis and engine}]
  - id: summit-jack-capacity
    suite: retrieval
