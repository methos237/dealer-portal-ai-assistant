  - id: summit-roof-sealant
    suite: retrieval
    question: Which sealant goes on the Summit roof seams and what temperature limit applies?
    expected: [{doc: owner-manual-summit.md, section: Roof}]
  - id: summit-fridge-level
    suite: retrieval
    question: How level must the Summit refrigerator be to avoid damaging the cooling unit?
    expected: [{doc: owner-manual-summit.md, section: Refrigerator}]
  - id: summit-step-wont-retract
    suite: retrieval
    question: The entry step will not retract and the STEP OUT light is on. What should I check?
    expected: [{doc: owner-manual-summit.md, section: Entry step}]
  - id: summit-isolator-voltmeter
    suite: retrieval
    question: How do I check the battery isolator relay with a voltmeter?
    expected: [{doc: owner-manual-summit.md, section: Battery isolator relay}, {doc: sb-2026-07-battery-isolator.md}]
