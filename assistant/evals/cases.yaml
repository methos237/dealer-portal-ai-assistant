    expected: [{doc: owner-manual-trailhead.md, section: Roof rack load limits}]
  # ---- retrieval: bulletins
  - id: sb03-affected-units
    suite: retrieval
    question: Which Aria build dates are affected by the slide-out seal bulletin?
    expected: [{doc: sb-2026-03-slide-out-seal.md, section: Affected units}]
  - id: sb03-cure-time
    suite: retrieval
    question: How long must the slide seal adhesive cure before retracting the slide?
    expected: [{doc: sb-2026-03-slide-out-seal.md, section: Repair procedure}]
  - id: sb03-claim-codes
    suite: retrieval
    question: What failure code and operation codes are used for a slide seal replacement claim?
    expected: [{doc: sb-2026-03-slide-out-seal.md, section: Warranty claim coding}]
  - id: sb07-symptom
    suite: retrieval
    question: Chassis batteries drain overnight on a Summit. Is there a bulletin?
    expected: [{doc: sb-2026-07-battery-isolator.md}, {doc: owner-manual-summit.md, section: Battery isolator relay}]
  - id: sb07-labor
    suite: retrieval
    question: Labor allowance for replacing the battery isolator relay
    expected: [{doc: sb-2026-07-battery-isolator.md, section: Labor allowance}]
  - id: sb09-f1-fault
    suite: retrieval
    question: Furnace flashes F1 and shuts down after 30 seconds. What is the fix?
    expected: [{doc: sb-2026-09-furnace-sail-switch.md}]
  - id: sb09-f5-before-f1
    suite: retrieval
    question: Furnace shows F5 then F1. Which is the root cause?
    expected: [{doc: sb-2026-09-furnace-sail-switch.md, section: Fault code list}, {doc: sb-2026-09-furnace-sail-switch.md, section: Diagnostic}]
  - id: sb09-goodwill
    suite: retrieval
    question: Can the sail switch bulletin be applied to a unit outside the 36 month warranty?
    expected: [{doc: sb-2026-09-furnace-sail-switch.md, section: Warranty claim coding}]
  - id: sb09-sail-switch-pressure
    suite: retrieval
    question: Airflow pressure needed to close the original and revised sail switch
    expected: [{doc: sb-2026-09-furnace-sail-switch.md, section: Condition}]
  # ---- answer: graded by the faithfulness judge in Phase 3 (facts the answer must state)
  - id: ans-aria-hitch-ball
    suite: answer
    question: What size hitch ball does the Aria need?
    expected_facts: ["2-5/16 inch"]
  - id: ans-aria-tongue-weight
    suite: answer
    question: What tongue weight should a loaded Aria 28 have?
    expected_facts: ["10 to 12 percent", "920", "1,100"]
  - id: ans-sb03-cure
    suite: answer
    question: How long does the slide seal adhesive cure before I can retract the slide?
    expected_facts: ["4 hours", "60 degrees", "8 hours"]
  - id: ans-sb09-f5
    suite: answer
    question: The furnace shows F5 and then F1. What should I do first?
    expected_facts: ["battery", "12.4 volts"]
  - id: ans-summit-def
    suite: answer
    question: What happens if the Summit runs out of DEF?
    expected_facts: ["derate", "5 mph"]
  - id: ans-not-in-docs
    suite: answer
    question: What is the towing capacity of a 2024 Ford F-250?
    expected_facts: []
    expect_abstain: true
