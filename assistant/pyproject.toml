[project]
name = "assistant"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic[mcp]>=1.8.0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b57",
    "fastapi[standard]>=0.141.1",
    "fastembed>=0.8.1",
    "mcp>=2.2.0",
    "openai>=3.19.2",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-psycopg>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.0",
    "pypdf>=6.19.0",
]

[project.scripts]
evals = "evals.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "rag", "evals"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-recording>=0.13.4",
    "ruff>=0.16.9",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/*" = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: calls the real Anthropic or Azure API; skipped without credentials",
    "slow: downloads the fastembed model on first run",
]
