services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dealer_portal
    volumes:
      - ./docker/postgres/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dealer_portal"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Traces from web, api and assistant (OTLP on 4318); UI on http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.14.0
    ports:
      - "16686:16686"
      - "4318:4318"

  # Optional: `docker compose --profile local-llm up -d`, then ANTHROPIC_BASE_URL=http://localhost:4000
  # and ANTHROPIC_API_KEY=local for the assistant. Needs `ollama serve` with `ollama pull qwen3` on the host.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["local-llm"]
    ports:
      - "4000:4000"
    volumes:
      - ./docker/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Sign-in for the demo: realm dealer-portal from docker/keycloak/realm.json (three users, password `portal`).
  # The browser reaches it at localhost:8080 and every token names that issuer; the containers reach it at
  # keycloak:8080 (OIDC_ISSUER_INTERNAL below), which KC_HOSTNAME_BACKCHANNEL_DYNAMIC serves matching endpoints for.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    profiles: ["demo"]
    ports: ["8080:8080"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro

  # `docker compose --profile full up --build`: the same images CI pushes to GHCR and Azure runs, signed in through
  # the OIDC_* values in .env (Entra). `--profile demo`: the same images plus Keycloak, no cloud account; the OIDC_*
  # defaults below apply whenever .env leaves them empty.
  api:
    build: { context: ., dockerfile: api/Dockerfile }
    image: ghcr.io/methos237/dealer-portal-api
    profiles: ["full", "demo"]
    ports: ["5080:5080"]
    env_file: .env
    environment:
      ConnectionStrings__Portal: Host=postgres;Port=5432;Database=dealer_portal;Username=postgres;Password=postgres
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/dealer-portal}
      OIDC_ISSUER_INTERNAL: ${OIDC_ISSUER_INTERNAL:-${OIDC_ISSUER:-http://keycloak:8080/realms/dealer-portal}}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-dealer-portal-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres: { condition: service_healthy }

  assistant:
    build: ./assistant
    image: ghcr.io/methos237/dealer-portal-assistant
    profiles: ["full", "demo"]
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dealer_portal
      PORTAL_API_URL: http://api:5080
      M365_MCP_URL: ${M365_SITE:+http://mcp-m365:8100/mcp}   # SharePoint tools only when M365 is configured
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/dealer-portal}
      OIDC_ISSUER_INTERNAL: ${OIDC_ISSUER_INTERNAL:-${OIDC_ISSUER:-http://keycloak:8080/realms/dealer-portal}}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-dealer-portal-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - fastembed:/cache
    depends_on:
      postgres: { condition: service_healthy }

  mcp-m365:
    build: ./mcp-m365
    image: ghcr.io/methos237/dealer-portal-mcp-m365
    profiles: ["full"]
    ports: ["8100:8100"]
    env_file: .env

  web:
    build: ./web
    image: ghcr.io/methos237/dealer-portal-web
    profiles: ["full", "demo"]
    ports: ["3000:3000"]
    env_file: .env
    environment:
      PORTAL_API_URL: http://api:5080
      ASSISTANT_URL: http://assistant:8000
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${AUTH_SECRET:-demo-only-session-secret-not-for-production}
      AUTH_OIDC_ID: ${AUTH_OIDC_ID:-dealer-portal-web}
      AUTH_OIDC_SECRET: ${AUTH_OIDC_SECRET:-dealer-portal-web-secret}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/dealer-portal}
      OIDC_ISSUER_INTERNAL: ${OIDC_ISSUER_INTERNAL:-${OIDC_ISSUER:-http://keycloak:8080/realms/dealer-portal}}
      OIDC_API_SCOPE: ${OIDC_API_SCOPE:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on: [api, assistant]

volumes:
  pgdata:
  fastembed:
